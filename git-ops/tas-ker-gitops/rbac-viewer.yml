apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: tas-ker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer
  namespace: tas-ker
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer
  namespace: tas-ker
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: tas-ker
roleRef:
  kind: Role
  name: viewer
  apiGroup: rbac.authorization.k8s.io
